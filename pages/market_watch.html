<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港美股行情 - 基金观察台</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    min-width: 100px;
    padding: 14px 8px;
    border: none;
    background: white;
    color: #555;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
  }

  .tab-btn:hover {
    background: #f6f9ff;
    color: #1a5fac;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #0d2b6e, #1a5fac);
    color: #fff;
    font-weight: 800;
    border-bottom-color: #f9e79f;
  }

  .tab-count {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 2px;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  .sub-section {
    background: white;
    border-radius: 10px;
    padding: 18px 22px 10px;
    margin-bottom: 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    border-top: 3px solid;
  }

  .sub-section.stock { border-color: #1a5fac; }
  .sub-section.long  { border-color: #c0392b; }
  .sub-section.short { border-color: #27ae60; }

  .sub-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 800;
  }

  .sub-head .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  .sub-head.stock .dot { background: #1a5fac; }
  .sub-head.long .dot  { background: #c0392b; }
  .sub-head.short .dot { background: #27ae60; }

  .sub-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 4px;
  }

  .etf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .etf-table thead tr {
    background: linear-gradient(90deg, #0d2b6e, #1a5fac);
    color: #fff;
  }

  .etf-table thead th {
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.15);
  }

  .etf-table thead th:last-child { border-right: none; }
  .etf-table thead th:first-child { padding-left: 16px; }
  .etf-table thead th:last-child { padding-right: 16px; }

  .etf-table tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid #f0f3f8;
    vertical-align: middle;
  }

  .etf-table tbody td:first-child { padding-left: 16px; }
  .etf-table tbody td:last-child { padding-right: 16px; }

  .etf-table tbody tr {
    transition: all 0.2s ease;
  }

  .etf-table tbody tr:hover {
    background: #f6f9ff !important;
    transform: translateX(6px);
    box-shadow: 0 2px 12px rgba(26,95,172,0.10);
  }

  .etf-table tbody tr.row-even { background: #fafbfe; }
  .etf-table tbody tr.row-odd { background: #fff; }

  .code-link {
    color: #1a5fac;
    text-decoration: none;
    font-weight: 700;
    font-family: 'SF Mono','Consolas',monospace;
    font-size: 13px;
  }

  .code-link:hover { text-decoration: underline; }

  .dir-tag {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .dir-tag.long  { background: #fde8e8; color: #c0392b; }
  .dir-tag.short { background: #e8f5e9; color: #27ae60; }
  .dir-tag.spot  { background: #eff4fd; color: #1a5fac; }

  .lev-badge {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 0 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
  }

  .lev-badge.long  { background: #fde8e8; color: #c0392b; }
  .lev-badge.short { background: #e8f5e9; color: #27ae60; }
  .lev-badge.lev1  { background: #eff4fd; color: #1a5fac; }

  .note-text {
    font-size: 11px;
    color: var(--muted);
    margin-left: 6px;
  }

  @media (max-width: 700px) {
    .tab-bar { flex-wrap: wrap; }
    .tab-btn { min-width: 80px; font-size: 12px; padding: 12px 6px; }
    .sub-section { padding: 12px 14px 8px; }
    .etf-table { font-size: 12px; }
  }
</style>
</head>

// ============ 渲染 ============
function levClass(lev) {
  if (lev.startsWith('-')) return 'short';
  if (lev === '1x') return 'lev1';
  return 'long';
}

function dirLabel(lev) {
  return lev.startsWith('-') ? '做空' : '做多';
}

function renderTable(items, type) {
  if (!items || !items.length) return '';
  var cls = type === 'long' ? 'long' : type === 'short' ? 'short' : 'spot';
  var rows = items.map(function(it, i) {
    var rowClass = i % 2 === 0 ? 'row-even' : 'row-odd';
    var levCell = type === 'stock'
      ? '<td><span class="dir-tag spot">正股</span></td>'
      : '<td><span class="dir-tag ' + cls + '">' + dirLabel(it.lev) + '</span><span class="lev-badge ' + levClass(it.lev) + '">' + it.lev + '</span></td>';
    return '<tr class="' + rowClass + '">' +
      '<td>' + it.name + (it.note ? '<span class="note-text">' + it.note + '</span>' : '') + '</td>' +
      '<td><a class="code-link" href="https://xueqiu.com/S/' + it.code + '" target="_blank" rel="noopener">' + it.code + '</a></td>' +
      levCell +
      '</tr>';
  }).join('');

  return '<thead><tr><th>名称</th><th>代码</th><th>方向 / 杠杆</th></tr></thead><tbody>' + rows + '</tbody>';
}

function renderPanel(g) {
  var html = '';
  if (g.stock && g.stock.length) {
    html += '<div class="sub-section stock">' +
      '<div class="sub-head stock"><span class="dot"></span>正股<span class="sub-count">' + g.stock.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.stock, 'stock') + '</table></div>';
  }
  if (g.long && g.long.length) {
    html += '<div class="sub-section long">' +
      '<div class="sub-head long"><span class="dot"></span>做多ETF<span class="sub-count">' + g.long.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.long, 'long') + '</table></div>';
  }
  if (g.short && g.short.length) {
    html += '<div class="sub-section short">' +
      '<div class="sub-head short"><span class="dot"></span>做空ETF<span class="sub-count">' + g.short.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.short, 'short') + '</table></div>';
  }
  return html;
}

// 渲染 tab 栏
var tabBarHTML = '';
WATCH_DATA.forEach(function(g, i) {
  var total = (g.stock ? g.stock.length : 0) + (g.long ? g.long.length : 0) + (g.short ? g.short.length : 0);
  tabBarHTML += '<button class="tab-btn" onclick="switchTab(' + i + ')">' + g.title + '<span class="tab-count">' + total + ' 只</span></button>';
});
document.getElementById('tabBar').innerHTML = tabBarHTML;

// 渲染面板
var panelHTML = '';
WATCH_DATA.forEach(function(g) {
  panelHTML += '<div class="tab-panel">' + renderPanel(g) + '</div>';
});
document.getElementById('tabPanels').innerHTML = panelHTML;

// 切换 tab
window.switchTab = function(idx) {
  var btns = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');
  btns.forEach(function(b, i) { b.classList.toggle('active', i === idx); });
  panels.forEach(function(p, i) { p.classList.toggle('active', i === idx); });
};

// 默认选中第一个

</script>
