<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>港美股行情 - 基金观察台</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  .watch-grid { display: grid; gap: 14px; }

  .watch-block {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }

  .watch-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 16px 28px;
    border: none;
    background: none;
    cursor: pointer;
    transition: background 0.2s;
  }

  .watch-toggle:hover { background: #f8fafc; }

  .watch-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 800;
    color: #0d2b6e;
  }

  .watch-title::before {
    content: '';
    width: 4px; height: 20px;
    background: #0d2b6e; border-radius: 2px;
    flex-shrink: 0;
  }

  .watch-count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .watch-arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #eef2f7;
    color: #0d2b6e;
    display: grid; place-items: center;
    font-size: 14px;
    transition: transform 0.3s;
  }

  .watch-block.open .watch-arrow { transform: rotate(180deg); }

  .watch-content {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .watch-block.open .watch-content { max-height: 4000px; }

  .watch-inner { padding: 0 28px 24px; }

  .sub-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0 10px;
    font-size: 14px;
    font-weight: 700;
    color: #222;
  }

  .sub-label .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .sub-label .dot.stock { background: #1a5fac; }
  .sub-label .dot.long  { background: #c0392b; }
  .sub-label .dot.short { background: #27ae60; }

  .etf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .etf-table thead th {
    background: #f0f3f8;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: left;
    border-bottom: 1px solid var(--line);
  }

  .etf-table thead th:first-child { padding-left: 16px; }
  .etf-table thead th:last-child { padding-right: 16px; }

  .etf-table tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid #f0f3f8;
    vertical-align: middle;
  }

  .etf-table tbody td:first-child { padding-left: 16px; }
  .etf-table tbody td:last-child { padding-right: 16px; }

  .etf-table tbody tr:hover { background: #f8fafc; }

  .code-link {
    color: #1a5fac;
    text-decoration: none;
    font-weight: 600;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 13px;
  }

  .code-link:hover { text-decoration: underline; }

  .lev-badge {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 0 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }

  .lev-badge.long  { background: #fde8e8; color: #c0392b; }
  .lev-badge.short { background: #e8f5e9; color: #27ae60; }
  .lev-badge.lev1  { background: #eff4fd; color: #1a5fac; }

  .dir-tag {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .dir-tag.long  { background: #fde8e8; color: #c0392b; }
  .dir-tag.short { background: #e8f5e9; color: #27ae60; }

  @media (max-width: 700px) {
    .watch-toggle { padding: 14px 16px; }
    .watch-inner { padding: 0 16px 20px; }
    .etf-table { font-size: 12px; }
    .etf-table thead th, .etf-table tbody td { padding: 6px 8px; }
  }
</style>

// ============ 渲染 ============
function levClass(lev) {
  if (lev.startsWith('-')) return 'short';
  if (lev === '1x') return 'lev1';
  return 'long';
}

function dirLabel(lev) {
  return lev.startsWith('-') ? '做空' : '做多';
}

function renderTable(items, type) {
  if (!items || !items.length) return '';
  var cls = type === 'long' ? 'long' : type === 'short' ? 'short' : '';
  var rows = items.map(function(it) {
    return '<tr>' +
      '<td>' + it.name + (it.note ? ' <span style="font-size:11px;color:var(--muted)">' + it.note + '</span>' : '') + '</td>' +
      '<td><a class="code-link" href="https://xueqiu.com/S/' + it.code + '" target="_blank" rel="noopener">' + it.code + '</a></td>' +
      (type === 'stock'
        ? '<td></td>'
        : '<td><span class="dir-tag ' + cls + '">' + dirLabel(it.lev) + '</span> <span class="lev-badge ' + levClass(it.lev) + '">' + it.lev + '</span></td>') +
      '</tr>';
  }).join('');

  var headers = type === 'stock'
    ? '<thead><tr><th>名称</th><th>代码</th><th></th></tr></thead>'
    : '<thead><tr><th>名称</th><th>代码</th><th>方向/杠杆</th></tr></thead>';

  return headers + '<tbody>' + rows + '</tbody>';
}

function renderGroup(g) {
  var dotStock = g.stock && g.stock.length
    ? '<div class="sub-label"><span class="dot stock"></span>正股<span style="font-weight:400;color:var(--muted);margin-left:4px">' + g.stock.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.stock, 'stock') + '</table>'
    : '';

  var dotLong = g.long && g.long.length
    ? '<div class="sub-label"><span class="dot long"></span>做多ETF<span style="font-weight:400;color:var(--muted);margin-left:4px">' + g.long.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.long, 'long') + '</table>'
    : '';

  var dotShort = g.short && g.short.length
    ? '<div class="sub-label"><span class="dot short"></span>做空ETF<span style="font-weight:400;color:var(--muted);margin-left:4px">' + g.short.length + ' 个</span></div>' +
      '<table class="etf-table">' + renderTable(g.short, 'short') + '</table>'
    : '';

  var total = (g.stock ? g.stock.length : 0) + (g.long ? g.long.length : 0) + (g.short ? g.short.length : 0);

  return '<div class="watch-block" id="group' + WATCH_DATA.indexOf(g) + '">' +
    '<button class="watch-toggle" onclick="this.parentElement.classList.toggle(\'open\')">' +
      '<span class="watch-title">' + g.title + '</span>' +
      '<span style="display:flex;align-items:center;gap:12px;">' +
        '<span class="watch-count">' + total + ' 只</span>' +
        '<span class="watch-arrow">▾</span>' +
      '</span>' +
    '</button>' +
    '<div class="watch-content"><div class="watch-inner">' +
      dotStock + dotLong + dotShort +
    '</div></div>' +
  '</div>';
}

document.getElementById('watchGrid').innerHTML = WATCH_DATA.map(renderGroup).join('');
