<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF/指数 均线多空矩阵 · 实时扫描</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1a2035; font-size: 12px; min-height: 100vh; }
  .report-shell { max-width: 1400px; margin: 0 auto; padding: 0 16px 24px; }
  .report-heading { margin: 0 0 14px; display: flex; align-items: center; gap: 24px; }
  .report-heading > div:first-child { flex: 1; }
  .report-heading .stats-pie { display: flex; align-items: center; gap: 20px; }
  .report-heading .pie-wrap { width: 140px; height: 140px; flex-shrink: 0; }
  .report-heading .pie-wrap canvas { width: 100%; height: 100%; }
  .report-heading .mini-stats { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .report-heading .mini-stats .row { display: flex; align-items: center; gap: 8px; }
  .report-heading .mini-stats .dot { width: 10px; height: 10px; border-radius: 50%; }
  .report-heading .mini-stats .val { font-weight: 600; font-size: 15px; }
  .report-heading .mini-stats .lbl { color: var(--muted); font-size: 12px; }
  .main { padding: 0 0 24px; }

  .chart-row { display: flex; gap: 16px; margin-bottom: 16px; align-items: stretch; }
  .chart-box { flex: 0 0 260px; background: white; border-radius: 10px; padding: 16px 0 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); display: flex; flex-direction: column; align-items: center; }
  .chart-box canvas { max-width: 200px; max-height: 200px; }
  .chart-summary { flex: 1; display: flex; gap: 10px; }
  .stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-card { background: white; border-radius: 10px; padding: 10px 14px; flex: 1; min-width: 80px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); text-align: center; }
  .stat-card .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-card .sub { font-size: 13px; margin-top: 4px; }
  .bull-color { color: #c0392b; }
  .bear-color { color: #27ae60; }
  .neutral-color { color: #8e9aaf; }

  .cols { display: flex; gap: 12px; }
  .col { flex: 1; background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); overflow: hidden; }
  .col-hd { padding: 14px 18px 10px; font-size: 16px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; border-left: 5px solid; }
  .col-hd.bull { border-left-color: #c0392b; color: #c0392b; }
  .col-hd.bear { border-left-color: #27ae60; color: #27ae60; }
  .col-hd .cnt { font-size: 12px; font-weight: 600; margin-left: auto; background: #f0f3f8; padding: 2px 10px; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: linear-gradient(90deg, #0d2b6e, #1a5fac); color: white; }
  thead th { padding: 9px 6px; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; letter-spacing: 0.3px; border-right: 1px solid rgba(255,255,255,0.15); }
  thead th:last-child { border-right: none; }
  thead th:first-child { text-align: left; padding-left: 14px; }
  tbody tr { border-bottom: 1px solid #f0f3f8; transition: all 0.2s ease; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f6f9ff !important; transform: translateX(6px); box-shadow: 0 2px 12px rgba(26,95,172,0.10); }
  tbody tr:nth-child(even) { background: #fafbfe; }
  tbody tr:nth-child(odd) { background: #fff; }
  td { padding: 6px 6px; text-align: center; vertical-align: middle; border-right: 1px solid #f0f3f8; line-height: 1.5; }
  td:last-child { border-right: none; }
  td:first-child { text-align: left; padding-left: 14px; border-right: none; }
  .str { font-size: 14px; font-weight: 700; width: 72px; }
  .str.up { color: #e63946; }
  .str.dn { color: #2ba84a; }
  .ma-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; min-width: 28px; }
  .ma-badge.hi { background: #e8f5e9; color: #2e7d32; }
  .ma-badge.mid { background: #fff3e0; color: #e65100; }
  .ma-badge.lo { background: #f5f5f5; color: #888; }
  .nm { font-weight: 600; color: #1a2035; font-size: 13px; }
  .cd { color: #1a5fac; font-size: 13px; font-weight: 600; }
  .cd a { color: #1a5fac; text-decoration: none; }
  .cd a:hover { text-decoration: underline; }
  .pr { font-size: 14px; font-weight: 600; }
  .ch { font-weight: 700; font-size: 14px; }
  .ch.up { color: #e63946; }
  .ch.dn { color: #2ba84a; }
  .idx-divider { position: relative; margin: 6px 14px 2px; height: 1px; background: #e0e5ec; }
  .idx-divider span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: white; padding: 0 12px; font-size: 11px; color: #8e9aaf; font-weight: 600; white-space: nowrap; }
  .idx-table thead tr { background: linear-gradient(90deg, #4a6fa5, #5b8cc9); }
  .idx-table thead th { padding: 7px 8px; font-size: 11px; }
  .idx-table td { padding: 5px 8px; }
  .idx-stats { display: flex; gap: 6px; padding: 6px 14px 8px; font-size: 11px; color: #888; justify-content: flex-end; }
  .idx-stats span { background: #f6f8fb; border-radius: 4px; padding: 1px 6px; }
  .page-footer { text-align: center; color: #aaa; font-size: 10px; padding: 16px; margin-top: 8px; }
  @media (max-width: 1000px) { .cols { flex-direction: column; } .chart-row { flex-direction: column; } .chart-box { flex: none; width: 100%; max-width: 260px; margin: 0 auto; } .chart-summary { flex-wrap: wrap; } }
</style>
</head>
<body>
  <script src="../assets/nav.js"></script>

  <main class="report-shell">
    <section class="report-heading">
      <div>
        <p class="eyebrow">ETF/Index Matrix</p>
        <h1>ETF/指数 均线多空矩阵</h1>
        <p>全市场ETF + 核心指数均线排列扫描 · 数据来源：iQuant · MA5/10/20/30/60</p>
        <p style="font-size:12px;color:var(--muted);margin-top:4px" id="hdrTime">--</p>
      </div>
      <div class="stats-pie">
        <div class="mini-stats" id="miniStats">
          <div class="row"><span class="dot" style="background:#c0392b"></span><span class="val" id="bullN">--</span><span class="lbl">多头</span><span id="bullPct" class="lbl">--</span></div>
          <div class="row"><span class="dot" style="background:#27ae60"></span><span class="val" id="bearN">--</span><span class="lbl">空头</span><span id="bearPct" class="lbl">--</span></div>
          <div class="row"><span class="dot" style="background:#8e9aaf"></span><span class="val" id="neutralN">--</span><span class="lbl">观望</span><span id="neutralPct" class="lbl">--</span></div>
        </div>
        <div class="pie-wrap">
          <canvas id="etfPie" role="img" aria-label="ETF多空分布饼图"></canvas>
        </div>
      </div>
    </section>

    <div class="main">
      <div class="cols">
        <div class="col">
          <div class="col-hd bull">均线多头排列 <span class="cnt" id="bullCnt">--</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ETF名称</th><th>代码</th><th>价格</th><th>涨跌幅</th><th>强度</th><th>次数</th></tr></thead>
              <tbody id="bullTb"></tbody>
            </table>
            <div class="idx-divider"><span>核心指数</span></div>
            <table class="idx-table">
              <thead><tr><th>指数名称</th><th>代码</th><th>涨跌幅</th><th>次数</th></tr></thead>
              <tbody id="bullIdxTb"></tbody>
            </table>
            <div class="idx-stats"><span id="bullIdxCnt">--</span></div>
          </div>
        </div>

        <div class="col">
          <div class="col-hd bear">均线空头排列 <span class="cnt" id="bearCnt">--</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ETF名称</th><th>代码</th><th>价格</th><th>涨跌幅</th><th>强度</th><th>次数</th></tr></thead>
              <tbody id="bearTb"></tbody>
            </table>
            <div class="idx-divider"><span>核心指数</span></div>
            <table class="idx-table">
              <thead><tr><th>指数名称</th><th>代码</th><th>涨跌幅</th><th>次数</th></tr></thead>
              <tbody id="bearIdxTb"></tbody>
            </table>
            <div class="idx-stats"><span id="bearIdxCnt">--</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="page-footer">
    iQuant 实时扫描 · 每5分钟自动更新 | “次数”为连续满足均线多空排列的次数
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="../data/etf_scan.js"></script>
  <script>
function badgeCls(n) {
  if (n >= 6) return 'hi';
  if (n >= 4) return 'mid';
  return 'lo';
}

function xqUrl(code) {
  if (code.startsWith('5') || code.startsWith('6')) return 'https://xueqiu.com/S/SH' + code;
  return 'https://xueqiu.com/S/SZ' + code;
}

function idxXqUrl(code) {
  if (/^\d{6}$/.test(code)) {
    if (code.startsWith('0') || code.startsWith('5') || code.startsWith('6')) return 'https://xueqiu.com/S/SH' + code;
    return 'https://xueqiu.com/S/SZ' + code;
  }
  return 'https://xueqiu.com/S/' + code;
}

function renderETF(tb, funds, isBull) {
  if (!funds.length) {
    tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#ccc;padding:24px">暂无数据</td></tr>';
    return;
  }
  tb.innerHTML = funds.map(function(f) {
    var pr = typeof f.price === 'number' ? f.price.toFixed(4) : f.price;
    var change = f.change || '0.00%';
    var xq = xqUrl(f.code);
    return '<tr>'
      + '<td class="nm">' + f.name + '</td>'
      + '<td class="cd"><a href="' + xq + '" target="_blank">' + f.code + '</a></td>'
      + '<td class="pr">' + pr + '</td>'
      + '<td class="ch ' + (change.startsWith('+') ? 'up' : 'dn') + '">' + change + '</td>'
      + '<td class="str ' + (isBull ? 'up' : 'dn') + '">' + f.strength + '</td>'
      + '<td><span class="ma-badge ' + badgeCls(f.maCount) + '">' + f.maCount + '</span></td>'
      + '</tr>';
  }).join('');
}

function renderIndex(tb, indices) {
  if (!indices.length) {
    tb.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#ccc;padding:16px">暂无数据</td></tr>';
    return;
  }
  tb.innerHTML = indices.map(function(f) {
    var change = f.change || '0.00%';
    var xq = idxXqUrl(f.code);
    return '<tr>'
      + '<td class="nm">' + f.name + '</td>'
      + '<td class="cd"><a href="' + xq + '" target="_blank">' + f.code + '</a></td>'
      + '<td class="ch ' + (change.startsWith('+') ? 'up' : 'dn') + '">' + change + '</td>'
      + '<td><span class="ma-badge ' + badgeCls(f.maCount) + '">' + f.maCount + '</span></td>'
      + '</tr>';
  }).join('');
}

function renderMatrix(d) {
  window.__ETF_MATRIX_CURRENT_UPDATE_TIME = d.updateTime || '';
  document.getElementById('hdrTime').textContent = '数据更新：' + d.updateTime + ' · 下次扫描：' + d.nextScan;

  var total = d.summary.totalScanned;
  var bull = d.summary.bullCount;
  var bear = d.summary.bearCount;
  var neutral = total - bull - bear;
  var bullPct = (bull / total * 100).toFixed(1) + '%';
  var bearPct = (bear / total * 100).toFixed(1) + '%';
  var neutralPct = (neutral / total * 100).toFixed(1) + '%';

  document.getElementById('bullN').textContent = bull;
  document.getElementById('bullPct').textContent = bullPct;
  document.getElementById('bearN').textContent = bear;
  document.getElementById('bearPct').textContent = bearPct;
  document.getElementById('neutralN').textContent = neutral;
  document.getElementById('neutralPct').textContent = neutralPct;

  document.getElementById('bullCnt').textContent = 'ETF ' + bull + ' · 指数 ' + ((d.bullIndices || []).length);
  document.getElementById('bearCnt').textContent = 'ETF ' + bear + ' · 指数 ' + ((d.bearIndices || []).length);

  renderETF(document.getElementById('bullTb'), d.bullETFs || [], true);
  renderETF(document.getElementById('bearTb'), d.bearETFs || [], false);

  var bullIdx = d.bullIndices || [];
  var bearIdx = d.bearIndices || [];
  renderIndex(document.getElementById('bullIdxTb'), bullIdx);
  renderIndex(document.getElementById('bearIdxTb'), bearIdx);
  document.getElementById('bullIdxCnt').textContent = '指数多头 ' + bullIdx.length + ' 个';
  document.getElementById('bearIdxCnt').textContent = '指数空头 ' + bearIdx.length + ' 个';

  updatePieChart(total, bull, bear, neutral);
}

(function() {
  var WINDOW_MS = 5 * 60 * 1000;
  var ATTEMPT_DELAYS = [2000, 4000, 6000, 8000, 10000];
  var nextWindowTimer = null;
  var attemptTimers = [];

  function parseUpdateTime(value) {
    if (!value) return 0;
    var normalized = String(value).replace(' ', 'T');
    var time = Date.parse(normalized);
    return Number.isFinite(time) ? time : 0;
  }

  function isFreshData(d) {
    return parseUpdateTime(d && d.updateTime) > parseUpdateTime(window.__ETF_MATRIX_CURRENT_UPDATE_TIME);
  }

  function clearAttemptTimers() {
    attemptTimers.forEach(function(timer) {
      clearTimeout(timer);
    });
    attemptTimers = [];
  }

  function fetchMatrix() {
    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 5000);
    return fetch('/api/etf-matrix?t=' + Date.now(), { cache: 'no-store', signal: controller.signal })
    .then(function(r) {
      clearTimeout(timeoutId);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      throw err;
    });
  }

  function scheduleNextWindow() {
    clearTimeout(nextWindowTimer);
    clearAttemptTimers();

    var now = Date.now();
    var nextWindow = Math.ceil(now / WINDOW_MS) * WINDOW_MS;
    if (nextWindow - now < 1000) nextWindow += WINDOW_MS;

    nextWindowTimer = setTimeout(function() {
      runRefreshWindow();
    }, nextWindow - now);
  }

  function runRefreshWindow() {
    clearAttemptTimers();
    ATTEMPT_DELAYS.forEach(function(delay) {
      var timer = setTimeout(function() {
        fetchMatrix()
          .then(function(d) {
            if (isFreshData(d)) {
              renderMatrix(d);
              clearAttemptTimers();
              scheduleNextWindow();
            }
          })
          .catch(function(err) {
            console.warn('ETF matrix auto refresh unavailable:', err);
          });
      }, delay);
      attemptTimers.push(timer);
    });

    attemptTimers.push(setTimeout(scheduleNextWindow, ATTEMPT_DELAYS[ATTEMPT_DELAYS.length - 1] + 500));
  }

  fetchMatrix()
    .then(function(d) {
      renderMatrix(d);
      scheduleNextWindow();
    })
    .catch(function(err) {
      console.warn('ETF matrix API unavailable, using local fallback:', err);
      renderMatrix(ETF_MATRIX_DATA);
      scheduleNextWindow();
    });
})();
  </script>
  <script>
  var etfPieChart = null;

  function updatePieChart(total, bull, bear, neutral) {
    var ctx = document.getElementById('etfPie');
    if (!ctx || typeof Chart === 'undefined') {
      console.warn('Chart.js not loaded yet, skipping pie chart update');
      return;
    }

    var bullPct = bull / total * 100;
    var labels = ['多头 ' + bullPct.toFixed(1) + '%', '空头', '观望'];
    var data = [bull, bear, neutral];

    if (etfPieChart) {
      etfPieChart.data.labels = labels;
      etfPieChart.data.datasets[0].data = data;
      etfPieChart.update();
      return;
    }

    etfPieChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#c0392b', '#27ae60', '#b0b8c4'],
          borderColor: '#fff',
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        cutout: '58%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(c) {
                var pct = (c.parsed / total * 100).toFixed(1);
                return c.label.split(' ')[0] + ': ' + c.parsed + '只 (' + pct + '%)';
              }
            }
          }
        }
      },
      plugins: [{
        id: 'centerText',
        afterDraw: function(chart) {
          var c = chart.ctx;
          c.save();
          c.font = '500 20px var(--font-sans, sans-serif)';
          c.fillStyle = '#1a2035';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(total, chart.width / 2, chart.height / 2 - 6);
          c.font = '400 11px var(--font-sans, sans-serif)';
          c.fillStyle = '#718097';
          c.fillText('ETF total', chart.width / 2, chart.height / 2 + 14);
          c.restore();
        }
      }]
    });
  }
  </script>
</body>
</html>
