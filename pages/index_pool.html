  .sec-hd.bull { border-left-color: #c0392b; color: #c0392b; }
  .sec-hd.bear { border-left-color: #27ae60; color: #27ae60; }
  .sec-hd .cnt { font-size: 12px; font-weight: 600; margin-left: auto; background: #f0f3f8; padding: 2px 10px; border-radius: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  @media (max-width: 700px) {

<body>

<div class="page-header">
  <h1>📊 指数均线多空矩阵</h1>
  <div class="sub">核心指数均线排列扫描 · 数据来源：iQuant · MA5/10/20/60/120/250</div>
  <div class="time" id="hdrTime">--</div>
</div>

<div class="main">
  <div class="stats-row">
    <div class="stat-card blue">
      <div class="val" id="totalS">--</div>
      <div class="lbl">扫描指数总数</div>
    </div>
    <div class="stat-card red">
      <div class="val" id="bullN">--</div>
      <div class="lbl">🐂 多头排列 （占比 <span id="bullP">--</span>）</div>
    </div>
    <div class="stat-card green">
      <div class="val" id="bearN">--</div>
      <div class="lbl">🐻 空头排列 （占比 <span id="bearP">--</span>）</div>
    </div>
  </div>

  <!-- 多头 -->
  <div class="section">
    <div class="sec-hd bull">🐂 均线多头排列 <span class="cnt" id="bullCnt">--</span></div>
    <table>
      <thead><tr><th>指数名称</th><th>代码</th><th>点位</th><th>涨跌幅</th><th>强度</th><th>次数</th></tr></thead>
      <tbody id="bullTb"></tbody>
    </table>
  </div>

  <!-- 空头 -->
  <div class="section">
    <div class="sec-hd bear">🐻 均线空头排列 <span class="cnt" id="bearCnt">--</span></div>
    <table>
      <thead><tr><th>指数名称</th><th>代码</th><th>点位</th><th>涨跌幅</th><th>强度</th><th>次数</th></tr></thead>
      <tbody id="bearTb"></tbody>
    </table>
  </div>
</div>

<div class="page-footer">
  iQuant 实时扫描 · 每5分钟自动更新 &nbsp;|&nbsp; "次数"为满足 MA5≻10≻20≻60≻120≻250 的均线条数（最大6）
</div>

<script>
// ═══ 数据内嵌 ═══
const DATA = {"updateTime":"2026-06-05 14:00:00","nextScan":"2026-06-05 14:05:00","summary":{"bullCount":5,"bullPct":"25.0%","bearCount":8,"bearPct":"40.0%","totalScanned":20},"bullIndices":[{"rank":1,"strength":"+0.08%","maCount":6,"name":"上证指数","code":"000001","point":3423.56,"change":"+1.25%"},{"rank":2,"strength":"+0.05%","maCount":5,"name":"沪深300","code":"000300","point":4012.38,"change":"+0.88%"},{"rank":3,"strength":"+0.03%","maCount":4,"name":"上证50","code":"000016","point":2789.15,"change":"+0.56%"},{"rank":4,"strength":"+0.02%","maCount":3,"name":"红利指数","code":"000015","point":3567.82,"change":"+0.34%"},{"rank":5,"strength":"+0.01%","maCount":3,"name":"中证银行","code":"399986","point":7123.45,"change":"+0.18%"}],"bearIndices":[{"rank":1,"strength":"-0.12%","maCount":6,"name":"科创50","code":"000688","point":935.72,"change":"-2.13%"},{"rank":2,"strength":"-0.09%","maCount":5,"name":"创业板指","code":"399006","point":1867.34,"change":"-1.78%"},{"rank":3,"strength":"-0.07%","maCount":5,"name":"中证1000","code":"000852","point":5432.18,"change":"-1.45%"},{"rank":4,"strength":"-0.06%","maCount":4,"name":"中证500","code":"000905","point":5678.90,"change":"-1.22%"},{"rank":5,"strength":"-0.05%","maCount":4,"name":"国证芯片","code":"980017","point":8234.56,"change":"-1.08%"},{"rank":6,"strength":"-0.04%","maCount":3,"name":"深证成指","code":"399001","point":10567.23,"change":"-0.76%"},{"rank":7,"strength":"-0.03%","maCount":3,"name":"恒生指数","code":"HSI","point":18654.30,"change":"-0.65%"},{"rank":8,"strength":"-0.02%","maCount":3,"name":"纳斯达克","code":"IXIC","point":16792.45,"change":"-0.42%"}]};

function badgeCls(n) { if (n>=6) return 'hi'; if (n>=4) return 'mid'; return 'lo'; }

function xueqiuUrl(code) {
  // A股指数: SH 0xxxxx, SZ 3xxxxx/9xxxxx
  if (/^\d{6}$/.test(code)) {
    if (code.startsWith('0') || code.startsWith('5') || code.startsWith('6')) {
      return 'https://xueqiu.com/S/SH' + code;
    }
    return 'https://xueqiu.com/S/SZ' + code;
  }
  // 港股/美股指数: 搜索链接
  return 'https://xueqiu.com/S/' + code;
}

function render(tb, indices, isBull) {
  if (!indices.length) {
    tb.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
    return;
  }
  tb.innerHTML = indices.map(function(f) {
    var pt = typeof f.point==='number' ? f.point.toFixed(0) : f.point;
    var xq = xueqiuUrl(f.code);
    return '<tr>'
      + '<td class="nm">' + f.name + '</td>'
      + '<td class="cd"><a href="' + xq + '" target="_blank" title="在雪球查看">' + f.code + '</a></td>'
      + '<td class="pt">' + pt + '</td>'
      + '<td class="ch ' + (f.change.startsWith('+')?'up':'dn') + '">' + f.change + '</td>'
      + '<td class="str ' + (isBull?'up':'dn') + '">' + f.strength + '</td>'
      + '<td><span class="ma-badge ' + badgeCls(f.maCount) + '">' + f.maCount + '</span></td>'
      + '</tr>';
  }).join('');
}

(function() {
  var d = DATA;
  document.getElementById('hdrTime').textContent = '数据更新：' + d.updateTime + ' · 下次扫描：' + d.nextScan;
  document.getElementById('totalS').textContent = d.summary.totalScanned;
  document.getElementById('bullN').textContent = d.summary.bullCount;
  document.getElementById('bullP').textContent = d.summary.bullPct;
  document.getElementById('bearN').textContent = d.summary.bearCount;
  document.getElementById('bearP').textContent = d.summary.bearPct;
  document.getElementById('bullCnt').textContent = d.summary.bullCount + ' 只';
  document.getElementById('bearCnt').textContent = d.summary.bearCount + ' 只';
  render(document.getElementById('bullTb'), d.bullIndices, true);
  render(document.getElementById('bearTb'), d.bearIndices, false);
})();
</script>
