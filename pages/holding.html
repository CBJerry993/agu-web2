<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的持仓 - 基金观察台</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .report-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .report-toolbar a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .report-toolbar a:hover {
      color: var(--blue);
    }
    .report-frame-wrap {
      height: calc(100vh - 120px);
      min-height: 720px;
    }

    /* ========== 登录验证层 ========== */
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(7, 20, 37, 0.75);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-overlay.hidden {
      display: none;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 36px 32px 28px;
      width: 420px;
      max-width: 96vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-card h2 {
      margin: 0 0 4px;
      font-size: 22px;
      color: var(--ink);
    }
    .login-card .sub {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .login-card input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(27,103,201,0.1);
    }

    /* ========== 拼图滑块 ========== */
    .puzzle-box {
      position: relative;
      width: 100%;
      height: 150px;
      margin: 16px 0 12px;
      background: #f5f7fa;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e4e7ed;
    }
    .puzzle-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.9);
    }
    .puzzle-hole {
      position: absolute;
      width: 42px;
      height: 42px;
      background: rgba(0,0,0,0.35);
      border: 2px dashed rgba(255,255,255,0.6);
      border-radius: 4px;
      z-index: 1;
    }
    .puzzle-piece {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 4px;
      cursor: grab;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .puzzle-piece:active {
      cursor: grabbing;
    }
    .puzzle-piece.verified {
      border-color: #67c23a;
      box-shadow: 0 0 0 3px rgba(103,194,58,0.3);
    }

    /* 滑块轨道 */
    .slider-track-wrap {
      position: relative;
      width: 100%;
      height: 36px;
      margin: 12px 0 16px;
      background: #e4e7ed;
      border-radius: 18px;
      overflow: hidden;
    }
    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: linear-gradient(90deg, #c6e0ff, #a8d1ff);
      border-radius: 18px 0 0 18px;
      transition: width 0.1s linear;
    }
    .slider-thumb {
      position: absolute;
      left: 2px;
      top: 2px;
      width: 32px;
      height: 32px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--blue);
      z-index: 2;
      transition: background 0.3s;
    }
    .slider-thumb:active {
      cursor: grabbing;
    }
    .slider-thumb.verified {
      background: #67c23a;
      color: #fff;
    }
    .slider-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #909399;
      pointer-events: none;
    }

    /* 登录按钮 */
    .login-btn {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #c0c4cc;
      color: #fff;
      transition: background 0.25s;
    }
    .login-btn.ready {
      background: var(--blue);
    }
    .login-btn.ready:hover {
      background: #1659ad;
    }

    .login-err {
      margin-top: 10px;
      font-size: 13px;
      color: var(--red);
      min-height: 20px;
    }

    .puzzle-tip {
      font-size: 12px;
      color: #909399;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- ========== 登录验证层 ========== -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h2>🔒 持仓分析</h2>
      <p class="sub">请输入账号密码并完成拼图验证</p>

      <input type="text" id="user-input" placeholder="账号" autocomplete="off">
      <input type="password" id="pass-input" placeholder="密码" autocomplete="off">

      <p class="puzzle-tip">拖动滑块，将拼图块移动到虚线框内</p>
      <div class="puzzle-box" id="puzzle-box">
        <div class="puzzle-bg" id="puzzle-bg"></div>
        <div class="puzzle-hole" id="puzzle-hole"></div>
        <div class="puzzle-piece" id="puzzle-piece"></div>
      </div>

      <div class="slider-track-wrap" id="slider-track">
        <div class="slider-fill" id="slider-fill"></div>
        <div class="slider-text" id="slider-text">→ 拖动滑块完成拼图</div>
        <div class="slider-thumb" id="slider-thumb">≡</div>
      </div>

      <button id="login-btn" class="login-btn" disabled>验 证</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>

  <!-- ========== 主内容（通过后显示）========== -->
  <script src="../assets/nav.js"></script>

  <main class="report-shell" id="main-content" style="display:none">
    <div class="report-toolbar">
      <a href="../reports/my_holding_report.html" target="_blank" rel="noopener">单独打开报告 →</a>
    </div>
    <section class="report-frame-wrap" aria-label="我的持仓基金分析">
      <iframe class="report-frame" src="../reports/my_holding_report.html" title="我的持仓基金分析"></iframe>
    </section>
  </main>

  <script>
  (function() {
    var USER = 'cbj';
    var PASS = 'cbj';
    var BG_IMG = '../assets/Abstract_financial_technology__2026-06-18T04-02-26.png';

    // 每次访问都需要验证（不做持久化）

    // ===== 拼图滑块逻辑 =====
    var puzzleBox = document.getElementById('puzzle-box');
    var puzzleBg = document.getElementById('puzzle-bg');
    var puzzleHole = document.getElementById('puzzle-hole');
    var puzzlePiece = document.getElementById('puzzle-piece');
    var sliderTrack = document.getElementById('slider-track');
    var sliderFill = document.getElementById('slider-fill');
    var sliderThumb = document.getElementById('slider-thumb');
    var sliderText = document.getElementById('slider-text');
    var loginBtn = document.getElementById('login-btn');
    var errEl = document.getElementById('login-err');
    var userInput = document.getElementById('user-input');
    var passInput = document.getElementById('pass-input');
    var overlay = document.getElementById('login-overlay');

    var sliderVerified = false;
    var dragging = false;
    var startX = 0;
    var startLeft = 0;
    var maxLeft = 0;
    var targetX = 0;
    var pieceStartX = 10;
    var PIECE_SIZE = 42;
    var TOLERANCE = 5;

    // 预加载背景图，确保图片可用后再初始化拼图
    function preloadImage(url, cb) {
      var img = new Image();
      img.onload = function() { cb(true); };
      img.onerror = function() { cb(false); };
      img.src = url;
    }

    // 初始化拼图
    function initPuzzle() {
      var boxW = puzzleBox.clientWidth;
      var boxH = puzzleBox.clientHeight;
      if (boxW <= 0 || boxH <= 0) {
        // DOM 尺寸还没就绪，稍后重试
        setTimeout(initPuzzle, 100);
        return;
      }

      // 设置背景图
      puzzleBg.style.backgroundImage = 'url(' + BG_IMG + ')';
      puzzleBg.style.backgroundSize = boxW + 'px ' + boxH + 'px';

      // 随机生成目标位置（右侧区域）
      var minTarget = Math.floor(boxW * 0.5);
      var maxTarget = boxW - PIECE_SIZE - 10;
      if (maxTarget <= minTarget) maxTarget = minTarget + 1;
      targetX = Math.floor(minTarget + Math.random() * (maxTarget - minTarget));

      // 拼图垂直居中
      var pieceTop = Math.floor((boxH - PIECE_SIZE) / 2);

      // 设置目标框位置
      puzzleHole.style.left = targetX + 'px';
      puzzleHole.style.top = pieceTop + 'px';

      // 设置拼图片初始位置和裁剪
      puzzlePiece.style.left = pieceStartX + 'px';
      puzzlePiece.style.top = pieceTop + 'px';
      puzzlePiece.style.backgroundImage = 'url(' + BG_IMG + ')';
      puzzlePiece.style.backgroundPosition = (-targetX) + 'px -' + pieceTop + 'px';
      puzzlePiece.style.backgroundSize = boxW + 'px ' + boxH + 'px';

      // 计算滑块最大值
      maxLeft = sliderTrack.clientWidth - sliderThumb.clientWidth - 4;
      if (maxLeft <= 0) maxLeft = 200;
    }

    // 设置滑块位置（同时移动拼图片）
    function setSliderPos(px) {
      px = Math.max(2, Math.min(maxLeft + 2, px));
      sliderThumb.style.left = px + 'px';
      sliderFill.style.width = px + 'px';

      // 同步移动拼图片：从起始位置到目标位置
      var progress = (px - 2) / maxLeft;
      var pieceX = pieceStartX + progress * (targetX - pieceStartX);
      puzzlePiece.style.left = pieceX + 'px';

      // 检查是否到达目标
      if (Math.abs(pieceX - targetX) <= TOLERANCE) {
        sliderVerified = true;
        sliderThumb.classList.add('verified');
        puzzlePiece.classList.add('verified');
        sliderText.textContent = '✓ 验证通过';
        checkReady();
      }
    }

    // 事件处理
    sliderThumb.addEventListener('mousedown', function(e) {
      if (sliderVerified) return;
      dragging = true;
      startX = e.clientX;
      startLeft = parseInt(sliderThumb.style.left) || 2;
      sliderThumb.style.transition = 'none';
      sliderFill.style.transition = 'none';
      puzzlePiece.style.transition = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging || sliderVerified) return;
      var dx = e.clientX - startX;
      setSliderPos(startLeft + dx);
    });

    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      sliderThumb.style.transition = 'left 0.3s ease';
      sliderFill.style.transition = 'width 0.3s ease';
      puzzlePiece.style.transition = 'left 0.3s ease';

      if (!sliderVerified) {
        setSliderPos(2);
      }
    });

    // 触摸支持
    sliderThumb.addEventListener('touchstart', function(e) {
      if (sliderVerified) return;
      dragging = true;
      startX = e.touches[0].clientX;
      startLeft = parseInt(sliderThumb.style.left) || 2;
      sliderThumb.style.transition = 'none';
      sliderFill.style.transition = 'none';
      puzzlePiece.style.transition = 'none';
      e.preventDefault();
    });

    document.addEventListener('touchmove', function(e) {
      if (!dragging || sliderVerified) return;
      var dx = e.touches[0].clientX - startX;
      setSliderPos(startLeft + dx);
    });

    document.addEventListener('touchend', function() {
      if (!dragging) return;
      dragging = false;
      sliderThumb.style.transition = 'left 0.3s ease';
      sliderFill.style.transition = 'width 0.3s ease';
      puzzlePiece.style.transition = 'left 0.3s ease';

      if (!sliderVerified) {
        setSliderPos(2);
      }
    });

    // ===== 登录按钮状态 =====
    function checkReady() {
      var hasUser = userInput.value.trim() !== '';
      var hasPass = passInput.value.trim() !== '';
      if (sliderVerified && hasUser && hasPass) {
        loginBtn.classList.add('ready');
        loginBtn.disabled = false;
      } else {
        loginBtn.classList.remove('ready');
        loginBtn.disabled = true;
      }
    }

    userInput.addEventListener('input', checkReady);
    passInput.addEventListener('input', checkReady);

    // ===== 登录验证 =====
    loginBtn.addEventListener('click', function() {
      var u = userInput.value.trim();
      var p = passInput.value.trim();

      if (u !== USER || p !== PASS) {
        errEl.textContent = '账号或密码错误，请重试';
        return;
      }

      if (!sliderVerified) {
        errEl.textContent = '请先完成拼图验证';
        return;
      }

      errEl.textContent = '';
      showContent();
    });

    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !loginBtn.disabled) {
        loginBtn.click();
      }
    });

    function showContent() {
      var el = document.getElementById('login-overlay');
      if (el) el.classList.add('hidden');
      el = document.getElementById('main-content');
      if (el) el.style.display = '';
    }

    // 预加载背景图，加载完成后初始化拼图
    preloadImage(BG_IMG, function(ok) {
      if (!ok) {
        // 图片加载失败，提示用户
        var tip = document.getElementById('slider-text');
        if (tip) tip.textContent = '⚠ 验证图片加载失败，请刷新重试';
        return;
      }
      initPuzzle();
    });

    window.addEventListener('resize', function() {
      maxLeft = sliderTrack.clientWidth - sliderThumb.clientWidth - 4;
      if (!sliderVerified) setSliderPos(2);
    });
  })();
  </script>
</body>
</html>
