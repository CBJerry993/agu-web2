name: Daily Top100 Update

on:
  schedule:
    # Runs daily at 00:00 Asia/Shanghai (16:00 UTC).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-top100:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate latest Top100 report
        run: python scripts/daily_top100.py

      - name: Commit updated report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Top100 report"
          file_pattern: "reports/top_100.html pages/top100.html"
