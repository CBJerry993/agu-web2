<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f3f8; color: #1a2035; font-size: 12px; }

  .page-header {

  .page-header::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.06); }

  .page-header .update-time { font-size: 13px; opacity: 0.7; margin-top: 3px; text-align: right; }

  .main { padding: 16px; max-width: 1200px; margin: 0 auto; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-card { background: white; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 120px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); border-top: 3px solid; text-align: center; }
  .stat-card .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-card .lbl { font-size: 11px; margin-top: 3px; }
  .stat-card.red    { border-color: #c0392b; } .stat-card.red .val,    .stat-card.red .lbl    { color: #c0392b; }
  .stat-card.orange { border-color: #e67e22; } .stat-card.orange .val, .stat-card.orange .lbl { color: #e67e22; }
  .stat-card.green  { border-color: #27ae60; } .stat-card.green .val,  .stat-card.green .lbl  { color: #27ae60; }
  .stat-card.purple { border-color: #8e44ad; } .stat-card.purple .val, .stat-card.purple .lbl { color: #8e44ad; }
  .stat-card.gray   { border-color: #888; }    .stat-card.gray .val,   .stat-card.gray .lbl   { color: #888; }
  .stat-card.blue   { border-color: #1a5fac; } .stat-card.blue .val,   .stat-card.blue .lbl   { color: #1a5fac; }

  .section-title {

    letter-spacing: 2px; border-left: 5px solid; padding: 4px 12px;
    background: white; border-radius: 6px;
  }
  .section-title .badge { font-size: 12px; padding: 3px 12px; border-radius: 20px; font-weight: 600; margin-left: 10px; letter-spacing: 0.5px; }

  .type-blocks { display: flex; flex-direction: column; gap: 10px; }
  .type-badge { display: inline-block; background: #e8f0fe; color: #1a5fac; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px; margin-bottom: 6px; }

  .table-wrap { overflow-x: auto; }

  .fund-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); font-size: 13px; }
  .fund-table thead tr { background: linear-gradient(90deg, #0d2b6e, #1a5fac); color: white; }
  .fund-table thead th { padding: 9px 5px; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; letter-spacing: 0.3px; border-right: 1px solid rgba(255,255,255,0.15); }
  .fund-table thead th:last-child { border-right: none; }
  .fund-table thead th:first-child { text-align: left; padding-left: 12px; }
  .fund-table tbody tr { border-bottom: 1px solid #f0f3f8; transition: all 0.2s ease; }
  .fund-table tbody tr:last-child { border-bottom: none; }
  .fund-table tbody tr:hover { background: #f6f9ff !important; transform: translateX(6px); box-shadow: 0 2px 12px rgba(26,95,172,0.10); }
  .fund-table tbody tr.row-even { background: #fafbfe; }
  .fund-table tbody tr.row-odd { background: #fff; }
  .fund-table td { padding: 5px 4px; text-align: center; vertical-align: middle; border-right: 1px solid #f0f3f8; line-height: 1.5; }
  .fund-table td:nth-child(n+2) { width: 72px; min-width: 72px; }
  .fund-table td:last-child { border-right: none; }
  .fund-table td:first-child { text-align: left; padding-left: 14px; border-right: none; }

  .col-fund { font-size: 14px; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-fund a { font-weight: 700; margin-right: 6px; color: #1a5fac; font-size: 15px; text-decoration: none; }
  .col-fund .fname { font-weight: 600; color: #1a2035; }

  .cell-ret { font-size: 15px; font-weight: 700; }
  .cell-rank { font-size: 12px; color: #666; margin-top: 2px; }
  .cell-pct { font-size: 12px; margin-top: 2px; }

  .up { color: #e63946; } .dn { color: #2ba84a; } .neutral { color: #888; font-weight: 600; } .na { color: #ccc; font-size: 10px; }
  .pct-top  { color: #c0392b; font-weight: 700; }
  .pct-good { color: #d94f3a; background: #fdecea; padding: 0 2px; border-radius: 2px; }
  .pct-mid  { color: #2e7d32; background: #e8f5e9; padding: 0 2px; border-radius: 2px; }
  .pct-bad  { color: #1a7a3c; font-weight: 700; }
  .rank-num { color: #555; font-family: monospace; font-size: 12px; }

  .note-bar { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px; font-size: 11px; color: #888; background: #fafbfe; border-top: 1px solid #f0f3f8; border-radius: 0 0 8px 8px; }
  .page-footer { text-align: center; color: #aaa; font-size: 10px; padding: 16px; margin-top: 8px; }

  .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .load-error { text-align: center; padding: 40px; color: #c0392b; font-size: 14px; }

  /* 兼容daily_top100.py的CSS类名 */
  .ph { background: linear-gradient(135deg, #0d2b6e 0%, #1a5fac 50%, #0d8fd9 100%); color: white; padding: 22px 28px 18px; position: relative; overflow: hidden; }

  .ph .ut { font-size: 13px; opacity: 0.7; margin-top: 3px; text-align: right; }
  .sr { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .scard { background: #fff; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 120px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); border-top: 3px solid; text-align: center; }
  .scard .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .scard .lbl { font-size: 11px; margin-top: 3px; }
  .scard.red { border-color: #c0392b; } .scard.red .val,.scard.red .lbl { color: #c0392b; }
  .scard.orange { border-color: #e67e22; } .scard.orange .val,.scard.orange .lbl { color: #e67e22; }
  .scard.green { border-color: #27ae60; } .scard.green .val,.scard.green .lbl { color: #27ae60; }
  .scard.purple { border-color: #8e44ad; } .scard.purple .val,.scard.purple .lbl { color: #8e44ad; }
  .scard.gray { border-color: #888; } .scard.gray .val,.scard.gray .lbl { color: #888; }
  .scard.blue { border-color: #1a5fac; } .scard.blue .val,.scard.blue .lbl { color: #1a5fac; }
  .st { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 24px 0 14px; font-size: 20px; font-weight: 800; color: #0d2b6e; letter-spacing: 2px; border-left: 5px solid; padding: 4px 12px; background: #fff; border-radius: 6px; }
  .st .badge { font-size: 12px; padding: 3px 12px; border-radius: 20px; font-weight: 600; margin-left: 10px; letter-spacing: 0.5px; }
  .tw { overflow-x: auto; }
  .ft { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); font-size: 13px; }
  .ft thead tr { background: linear-gradient(90deg, #0d2b6e, #1a5fac); color: #fff; }
  .ft thead th { padding: 9px 5px; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; letter-spacing: 0.3px; border-right: 1px solid rgba(255,255,255,0.15); }
  .ft thead th:last-child { border-right: none; }
  .ft thead th:first-child { text-align: left; padding-left: 12px; }
  .ft tbody tr { border-bottom: 1px solid #f0f3f8; transition: background 0.15s; }
  .ft tbody tr:last-child { border-bottom: none; }
  .ft tbody tr:hover { background: #f6f9ff !important; }
  .ft tbody tr.re { background: #fafbfe; }
  .ft tbody tr.ro { background: #fff; }
  .ft td { padding: 5px 4px; text-align: center; vertical-align: middle; border-right: 1px solid #f0f3f8; line-height: 1.5; }
  .ft td:nth-child(n+2) { width: 72px; min-width: 72px; }
  .ft td:last-child { border-right: none; }
  .ft td:first-child { text-align: left; padding-left: 14px; border-right: none; }
  .cf { font-size: 14px; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf a { font-weight: 700; margin-right: 6px; color: #1a5fac; font-size: 15px; text-decoration: none; }
  .cf .fn { font-weight: 600; color: #1a2035; }
  .cr { font-size: 15px; font-weight: 700; }
  .crk { font-size: 12px; color: #666; margin-top: 2px; }
  .cp { font-size: 12px; margin-top: 2px; }
  .up { color: #e63946; } .dn { color: #2ba84a; } .neutral { color: #888; font-weight: 600; } .na { color: #ccc; font-size: 10px; }
  .pt { color: #c0392b; font-weight: 700; }
  .pg { color: #d94f3a; background: #fdecea; padding: 0 2px; border-radius: 2px; }
  .pm { color: #2e7d32; background: #e8f5e9; padding: 0 2px; border-radius: 2px; }
  .pb { color: #1a7a3c; font-weight: 700; }
  .rn { color: #555; font-family: monospace; font-size: 12px; }
  .nb { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px; font-size: 11px; color: #888; background: #fafbfe; border-top: 1px solid #f0f3f8; border-radius: 0 0 8px 8px; }
  .pf { text-align: center; color: #aaa; font-size: 10px; padding: 16px; margin-top: 8px; }

  @media (max-width: 1100px) { .fund-table { font-size: 11px; } .col-fund, .col-fund a, .col-fund .fname { font-size: 11px; } .cell-ret { font-size: 12px; } .ft { font-size: 11px; } .cf, .cf a, .cf .fn { font-size: 11px; } .cr { font-size: 12px; } }

  /* 持仓透视 */
  .holdings-section { margin-bottom: 20px; }
  .holdings-title { display: flex; align-items: center; margin: 24px 0 8px; font-size: 18px; font-weight: 700; color: #1a2035; border-left: 5px solid; padding: 4px 12px; background: white; border-radius: 6px; }
  .holdings-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); font-size: 13px; margin-bottom: 12px; }
  .holdings-table thead tr { background: linear-gradient(90deg,#1a2035,#2c3e50); color: white; }
  .holdings-table thead th { padding: 8px 10px; font-size: 11px; font-weight: 600; text-align: left; }
  .holdings-table tbody tr { border-bottom: 1px solid #f0f3f8; }
  .holdings-table tbody tr:hover { background: #f6f9ff; }
  .holdings-table td { padding: 6px 10px; vertical-align: middle; }
  .stock-code { font-family: monospace; font-weight: 600; color: #1a5fac; width: 90px; }
  .stock-name { font-weight: 600; }
  .stock-desc { font-size: 12px; color: #666; max-width: 280px; }
  .freq-bar { font-family: monospace; color: #e67e22; letter-spacing: 1px; }
  .freq-num { color: #c0392b; font-weight: 700; margin-left: 6px; }
</style>
</head>
<body>

<div class="page-header">
  <div class="eyebrow">Top100 Report</div>
  <h1>全市场Top100基金收益排行</h1>
  <div class="subtitle">今年以来收益率排名 · 夯/顶/人上人/拉/NPC五级分类 · 涨幅 &amp; 同类排名</div>
  <div class="update-time" id="update-time">加载中...</div>
</div>

<div class="main">
  <div class="stats-row" id="stats">
    <div class="loading">数据加载中...</div>
  </div>

  <div id="sections">
    <div class="loading">数据加载中...</div>
  </div>

  <div id="holdings-section"></div>
</div>

<div class="page-footer">
  数据来源：东方财富天天基金 &nbsp;|&nbsp; 红涨绿跌(A股惯例) &nbsp;|&nbsp; 按今年来降序排列 &nbsp;|&nbsp; AI生成仅供参考
</div>

<script>
fetch('top100_data.json', {cache: 'no-cache'})
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    document.getElementById('update-time').innerHTML =
      '净值更新：' + data.updateDate + ' &nbsp;|&nbsp; 数据来源：东方财富天天基金 &nbsp;|&nbsp; 生成于 ' + data.generateDate;
    document.getElementById('stats').innerHTML = data.statsHtml;
    document.getElementById('sections').innerHTML = data.sectionsHtml;
    if (data.holdingsHtml) {
      document.getElementById('holdings-section').innerHTML = data.holdingsHtml;
    }
    document.title = '全市场Top100基金收益排行 · ' + data.generateDate;
  })
  .catch(err => {
    document.getElementById('stats').innerHTML = '<div class="load-error">数据加载失败: ' + err.message + '</div>';
    document.getElementById('sections').innerHTML = '<div class="load-error">数据加载失败: ' + err.message + '</div>';
    console.error('加载top100_data.json失败:', err);
  });
</script>

</body>
</html>
