<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDII海外基金收益排行</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f3f8; color: #1a2035; font-size: 12px; }

  .page-header {
    background: linear-gradient(135deg, #0d2b6e 0%, #1a5fac 50%, #0d8fd9 100%);
    color: white; padding: 22px 28px 18px; position: relative; overflow: hidden;
  }
  .page-header::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.06); }
  .page-header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .page-header .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
  .page-header .subtitle { font-size: 14px; opacity: 0.85; margin-top: 6px; }
  .page-header .update-time { font-size: 13px; opacity: 0.7; margin-top: 3px; text-align: right; }

  .main { padding: 16px; max-width: 1200px; margin: 0 auto; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-card { background: white; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 100px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); border-top: 3px solid; text-align: center; }
  .stat-card .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-card .lbl { font-size: 11px; margin-top: 3px; }
  .stat-card.blue    { border-color: #1a5fac; }
  .stat-card.blue .val,    .stat-card.blue .lbl    { color: #1a5fac; }
  .stat-card.red     { border-color: #c0392b; }
  .stat-card.red .val,     .stat-card.red .lbl     { color: #c0392b; }
  .stat-card.green   { border-color: #27ae60; }
  .stat-card.green .val,   .stat-card.green .lbl   { color: #27ae60; }
  .stat-card.orange  { border-color: #e67e22; }
  .stat-card.orange .val,  .stat-card.orange .lbl  { color: #e67e22; }
  .stat-card.purple  { border-color: #8e44ad; }
  .stat-card.purple .val,  .stat-card.purple .lbl  { color: #8e44ad; }
  .stat-card.gray    { border-color: #888; }
  .stat-card.gray .val,    .stat-card.gray .lbl    { color: #888; }

  .section-title {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
    margin: 24px 0 14px;
    font-size: 20px; font-weight: 800; color: #0d2b6e;
    letter-spacing: 2px;
    border-left: 5px solid #0d2b6e;
    padding: 4px 12px;
    background: white;
    border-radius: 6px;
  }
  .section-title .badge { font-size: 12px; padding: 3px 12px; border-radius: 20px; font-weight: 600; margin-left: 10px; letter-spacing: 0.5px; }

  .table-wrap { overflow-x: auto; }

  .fund-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); font-size: 13px; }
  .fund-table thead tr { background: linear-gradient(90deg, #0d2b6e, #1a5fac); color: white; }
  .fund-table thead th { padding: 9px 5px; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; letter-spacing: 0.3px; border-right: 1px solid rgba(255,255,255,0.15); }
  .fund-table thead th:last-child { border-right: none; }
  .fund-table thead th:nth-child(4) { display: none; }
  .fund-table thead th:first-child { text-align: center; padding: 9px 2px; min-width: 32px; }
  .fund-table tbody tr { border-bottom: 1px solid #f0f3f8; transition: all 0.2s ease; }
  .fund-table tbody tr:last-child { border-bottom: none; }
  .fund-table tbody tr:hover { background: #f6f9ff !important; transform: translateX(6px); box-shadow: 0 2px 12px rgba(26,95,172,0.10); }
  .fund-table tbody tr.row-even { background: #fafbfe; }
  .fund-table tbody tr.row-odd { background: #fff; }
  .fund-table td { padding: 5px 4px; text-align: center; vertical-align: middle; border-right: 1px solid #f0f3f8; line-height: 1.5; white-space: nowrap; }
  .fund-table td:nth-child(n+4) { min-width: 90px; }
  .fund-table td:last-child { border-right: none; }
  .fund-table td:first-child { text-align: center; padding: 5px 2px; border-right: none; }
  .fund-table td:nth-child(2) { text-align: left; min-width: 180px; padding-left: 14px; }
  .fund-table td:nth-child(3) { text-align: center; min-width: 80px; }
  .col-fund { font-size: 14px; }
  .col-fund a { font-weight: 700; margin-right: 6px; color: #1a5fac; font-size: 15px; text-decoration: none; }
  .col-fund .fname { font-weight: 600; color: #1a2035; }
  .col-fund .fsuffix { font-size: 11px; color: #999; margin-left: 3px; }

  .cell-ret { font-size: 15px; font-weight: 700; }
  .cell-rank { font-size: 12px; color: #666; margin-top: 2px; }
  .cell-pct { font-size: 12px; margin-top: 2px; }

  .up { color: #e63946; }
  .dn { color: #2ba84a; }
  .neutral { color: #888; font-weight: 600; }
  .na { color: #ccc; font-size: 10px; }

  .pct-top  { color: #c0392b; font-weight: 700; }
  .pct-good { color: #d94f3a; background: #fdecea; padding: 0 2px; border-radius: 2px; }
  .pct-mid  { color: #2e7d32; background: #e8f5e9; padding: 0 2px; border-radius: 2px; }
  .pct-bad  { color: #1a7a3c; font-weight: 700; }

  .rank-num { color: #555; font-family: monospace; font-size: 12px; }

  .tag {
    display: inline-block;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.5;
    text-align: center;
    white-space: nowrap;
  }
  .tag-open  { background: #e6f7ee; color: #27ae60; border: 1px solid #b7ebd5; }
  .tag-limit { background: #fff7e6; color: #e67e22; border: 1px solid #ffd591; }
  .tag-stop  { background: #f5f5f5; color: #999; border: 1px solid #ddd; }
  .tag-etf   { background: #e6f0ff; color: #1a5fac; border: 1px solid #bcd4ff; }

  .col-today { min-width: 56px; }

  .page-footer { text-align: center; color: #aaa; font-size: 10px; padding: 16px; margin-top: 8px; }

  .note-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 8px 16px; font-size: 11px; color: #888;
    background: #fafbfe; border-top: 1px solid #f0f3f8; border-radius: 0 0 8px 8px;
  }

  /* === 美股重仓股板块 === */
  .holdings-section { margin-top: 20px; }
  .holdings-table {
    width: 100%; border-collapse: collapse; background: white;
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07); font-size: 13px;
  }
  .holdings-table thead tr { background: linear-gradient(90deg, #1a2035, #2c3e50); color: white; }
  .holdings-table thead th { padding: 8px 10px; font-size: 11px; font-weight: 600; text-align: left; white-space: nowrap; }
  .holdings-table tbody tr { border-bottom: 1px solid #f0f3f8; }
  .holdings-table tbody tr:hover { background: #f6f9ff; }
  .holdings-table td { padding: 8px 10px; vertical-align: middle; }
  .stock-code { font-family: monospace; font-weight: 700; color: #1a5fac; width: 80px; }
  .stock-name { font-weight: 600; width: 140px; }
  .stock-freq { min-width: 140px; }
  .stock-desc { font-size: 11px; color: #718097; line-height: 1.5; max-width: 340px; }
  .freq-bar-wrap { display: inline-block; width: 80px; height: 8px; background: #f0f0f0; border-radius: 4px; vertical-align: middle; margin-right: 8px; }
  .freq-bar-fill { height: 8px; border-radius: 4px; }
  .freq-num { font-weight: 700; color: #1a2035; font-size: 13px; }

  /* 加载状态 */
  .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .load-error { text-align: center; padding: 40px; color: #c0392b; font-size: 14px; }

  @media (max-width: 1100px) { .fund-table { font-size: 10px; } .fund-table td:nth-child(3) { max-width: 140px; } }
</style>
</head>
<body>

<div class="page-header">
  <div class="eyebrow">QDII Report</div>
  <h1>QDII海外基金收益排行</h1>
  <div class="subtitle">精选24只QDII海外基金 · 收益率 &amp; 同类排名 · 按今年以来收益排序</div>
  <div class="update-time" id="update-time">加载中...</div>
</div>

<div class="main">

  <div class="stats-row" id="stats">
    <div class="loading">数据加载中...</div>
  </div>

  <div class="section-title">
    QDII基金收益排行
    <span class="badge" style="background:#e8f0fe;color:#1a5fac" id="fund-count-badge">--只 · 按今年以来收益排序</span>
  </div>

  <div class="table-wrap">
  <table class="fund-table">
    <thead><tr>
      <th>序号</th>
      <th>基金（代码+简称）</th>
      <th>申购状态/限额</th>
      <th>最近1日</th>
      <th>近1周<br>收益/排名</th>
      <th>近1月<br>收益/排名</th>
      <th>近3月<br>收益/排名</th>
      <th>近6月<br>收益/排名</th>
      <th>近1年<br>收益/排名</th>
      <th>今年以来<br>收益/排名</th>
    </tr></thead>
    <tbody id="tbody">
      <tr><td colspan="9" class="loading">数据加载中...</td></tr>
    </tbody>
  </table>
  </div>

</div>

<div id="holdings"></div>

<div class="page-footer">
  QDII海外基金收益排行 · 数据来源：天天基金 · 排名来源：天天基金同类排名 · 涨跌颜色：中国A股惯例（涨红跌绿）
</div>

<script src="../data/pe_ttm_qdii.js"></script>
<script>
fetch('qdii_data.json', {cache: 'no-cache'})
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    // 日期行
    document.getElementById('update-time').innerHTML =
      '净值更新：' + data.updateDate + ' &nbsp;|&nbsp; 数据来源：天天基金 &nbsp;|&nbsp; 生成于 ' + data.generateDate;

    // 统计卡片
    document.getElementById('stats').innerHTML = data.statsHtml;

    // 基金数量标签
    document.getElementById('fund-count-badge').textContent = data.fundCount + '只 · 按今年以来收益排序';

    // 表格数据
    document.getElementById('tbody').innerHTML = data.tbodyHtml;

    // 美股持仓
    if (data.holdingsHtml) {
      document.getElementById('holdings').innerHTML = data.holdingsHtml;
      // 注入PE TTM
      if (typeof PE_TTM_QDII !== 'undefined') {
        var stockCells = document.querySelectorAll('#holdings .stock-name');
        stockCells.forEach(function(cell) {
          var parent = cell.parentElement;
          var codeCell = parent.querySelector('.stock-code');
          if (!codeCell) return;
          var code = codeCell.textContent.trim();
          var pe = PE_TTM_QDII[code];
          if (pe !== undefined) {
            var td = document.createElement('td');
            td.style.textAlign = 'center';
            td.style.fontWeight = '600';
            td.style.fontSize = '13px';
            td.textContent = pe.toFixed(2);
            // 插入到 stock-name 后面（即简介列之前）
            if (cell.nextSibling) {
              parent.insertBefore(td, cell.nextSibling);
            } else {
              parent.appendChild(td);
            }
          }
        });
        // 添加表头"PE TTM"到简称后面
        var thead = document.querySelector('#holdings .holdings-table thead tr');
        if (thead) {
          var th = document.createElement('th');
          th.textContent = 'PE TTM';
          th.style.textAlign = 'center';
          var nameTh = thead.querySelector('th:nth-child(2)');
          if (nameTh && nameTh.nextSibling) {
            thead.insertBefore(th, nameTh.nextSibling);
          } else {
            thead.appendChild(th);
          }
        }
      }
    }

    // 更新页面标题
    document.title = 'QDII海外基金收益排行 · ' + data.generateDate;
  })
  .catch(err => {
    document.getElementById('stats').innerHTML = '<div class="load-error">数据加载失败: ' + err.message + '</div>';
    document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="load-error">数据加载失败: ' + err.message + '</td></tr>';
    console.error('加载qdii_data.json失败:', err);
  });
</script>

</body>
</html>
